<details class="confirm-details">
  <summary class="btn btn-danger-text btn-sm">{{ label|default:"Удалить" }}</summary>
  <div class="confirm-popover">
    <p>{{ message|default:"Подтвердите удаление записи." }}</p>
    <form method="post" action="{{ action_url }}" class="inline-form">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger-solid btn-sm">Да, удалить</button>
    </form>
  </div>
</details>
