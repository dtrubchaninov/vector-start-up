{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}
{% block breadcrumb %}{{ page_title }}{% endblock %}
{% block topbar_action %}
  <a href="{% url 'ventures_overview' %}" class="btn btn-secondary">К венчурам</a>
{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ page_title }}</h1>
</div>

<div class="form-card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'includes/_form_fields.html' %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
      <a href="{% url 'ventures_overview' %}" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
