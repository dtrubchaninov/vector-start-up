{% if messages %}
<div class="messages-wrap" role="status" aria-live="polite">
  {% for message in messages %}
    <div class="alert-wrapper">
      <input type="checkbox" id="alert-dismiss-{{ forloop.counter }}" class="alert-toggle">
      <div class="alert alert-{{ message.tags|default:'info' }}">
        <span>{{ message }}</span>
        <label for="alert-dismiss-{{ forloop.counter }}" class="alert-close" aria-label="Закрыть">&times;</label>
      </div>
    </div>
  {% endfor %}
</div>
{% endif %}
